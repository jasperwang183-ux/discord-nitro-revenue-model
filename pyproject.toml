[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nitro-model"
version = "0.1.0"
description = "Cohort-based, driver-level revenue model of Discord Nitro (portfolio project; all figures are third-party estimates)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
